[project]
name = "servidor-salas"
version = "0.1.0"
description = "Servidor MCP (Streamable HTTP) das salas de reunião — desafio A Ponte"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "mcp-types==2.3.0", "pydantic==2.14.1", "starlette==1.7.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "jsonschema==4.26.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
