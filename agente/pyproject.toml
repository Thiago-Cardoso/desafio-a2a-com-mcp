[project]
name = "agente-salas"
version = "0.1.0"
description = "Agente host MCP e servidor A2A v1.0 — desafio A Ponte"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "mcp-types==2.3.0", "a2a-sdk==1.2.2", "protobuf==7.36.2", "starlette==1.7.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "anyio==4.15.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
